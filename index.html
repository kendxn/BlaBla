<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #3F588F;
            --border-joint: #0c1424;
            --bg-top: #3F588F;
            --bg-bottom: #3F588F;
            --board-bg: #152030;
            --cell-empty: #1f2b3f;
            --grid-line: #131d2c;
            --text-color: #ffffff;
            --grid-gap: 1px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', 'Silkscreen', monospace, sans-serif;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        @font-face {
            font-family: 'PressStart2P';
            src: url('assets/press-start-2p-font/PressStart2P-vaV7.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-image: url('assets/Gemini_Generated_Image_fcv39gfcv39gfcv3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'PressStart2P', 'Press Start 2P', monospace, sans-serif;
        }

        /* Testo Pixel Art per schermata Game Over e Titoli */
        .text-3d {
            font-weight: bold;
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            text-shadow: 
                3px 3px 0px #000000, 
                6px 6px 0px rgba(0,0,0,0.5);
        }

        /* 
           =========================================================
           DESIGN HEADER NEGOZIO (TOP BAR, LINES CLEARED & BUTTONS)
           =========================================================
        */
        .game-container {
            position: relative;
            width: 100vw;
            height: 25vh;
            margin-top: 1vh;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }

        .top-bar {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            height: 18%;
            z-index: 10;
        }

        .top-bar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            filter: 
                drop-shadow(-8px 0 12px rgba(0,0,0,0.45))
                drop-shadow(8px 0 12px rgba(0,0,0,0.45))
                drop-shadow(0 4px 8px rgba(0,0,0,0.35));
        }

        .top-bar-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2% 0 1%;
            z-index: 11;
        }

        .icon-crown {
            height: 85%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.4));
            animation: crownBounce 2s ease-in-out infinite;
        }

        @keyframes crownBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .max-score-text {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            margin-left: 2vw;
            margin-right: auto;
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            font-size: clamp(14px, 3.7vw, 24px);
            color: #4a3520;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }

        .max-score-text .score-value {
            display: flex;
            align-items: center;
            gap: 0.2vw;
        }

        .icon-settings {
            height: 70%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.4));
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .icon-settings:hover {
            transform: rotate(45deg);
        }

        /* ===== LINES CLEARED SECTION ===== */
        .lines-section {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
        }

        .lines-label {
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            font-size: clamp(11px, 3.2vw, 20px);
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #000000,
                -3px -3px 0 #000000,
                3px -3px 0 #000000,
                -3px 3px 0 #000000,
                0 4px 0 #000000,
                4px 0 0 #000000;
            letter-spacing: 1px;
            background: none;
            border: none;
            padding: 0;
        }

        .lines-blocks {
            display: flex;
            align-items: center;
            gap: 1vw;
        }

        .lines-blocks .block {
            height: clamp(26px, 7vw, 50px);
            width: clamp(26px, 7vw, 50px);
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(3px 4px 5px rgba(0,0,0,0.6));
            transition: transform 0.2s ease;
        }

        .lines-blocks .block.green {
            animation: blockWaveSweep 2.5s ease-in-out infinite;
        }

        .lines-blocks .block.green:nth-child(1) { animation-delay: 0s; }
        .lines-blocks .block.green:nth-child(2) { animation-delay: 0.42s; }
        .lines-blocks .block.green:nth-child(3) { animation-delay: 0.84s; }
        .lines-blocks .block.green:nth-child(4) { animation-delay: 1.26s; }
        .lines-blocks .block.green:nth-child(5) { animation-delay: 1.68s; }
        .lines-blocks .block.green:nth-child(6) { animation-delay: 2.1s; }

        @keyframes blockWaveSweep {
            0% { transform: scale(1); filter: drop-shadow(3px 4px 5px rgba(0,0,0,0.6)) brightness(1); }
            12% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(80,255,120,0.9)) brightness(1.35); }
            25%, 100% { transform: scale(1); filter: drop-shadow(3px 4px 5px rgba(0,0,0,0.6)) brightness(1); }
        }

        .coins-icon {
            height: clamp(30px, 8vw, 55px);
            width: auto;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(3px 4px 5px rgba(0,0,0,0.6));
            animation: coinsSpin 3s ease-in-out infinite;
        }

        .coin-container {
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 1vw;
        }

        .coin-plus-one {
            position: absolute;
            top: -10px;
            right: -15px;
            color: #ffea00;
            font-size: clamp(14px, 4vw, 24px);
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
        }

        .coin-plus-one.show {
            animation: floatUpFade 1s ease-out forwards;
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(10px) scale(0.5); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            80% { opacity: 1; transform: translateY(-15px) scale(1); }
            100% { opacity: 0; transform: translateY(-25px) scale(1); }
        }

        @keyframes coinsSpin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.05); }
        }

        /* ===== BOTTOM SECTION (Buttons + Score Centered) ===== */
        .bottom-section {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            height: 35%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-skills,
        .btn-shop {
            height: 107%;
            width: auto;
            max-width: 38%;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.5));
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-skills:hover,
        .btn-shop:hover {
            transform: scale(1.08);
            filter: drop-shadow(3px 4px 10px rgba(255,200,100,0.5));
        }

        .btn-skills:active,
        .btn-shop:active {
            transform: scale(0.95);
        }

        /* ===== CURRENT SCORE AREA ===== */
        .current-score-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            z-index: 10;
        }

        .current-score-label {
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            font-size: clamp(8px, 2.2vw, 15px);
            color: #e8c88a;
            text-shadow: 
                2px 2px 0 #2a1a0a,
                -1px -1px 0 #2a1a0a,
                1px -1px 0 #2a1a0a,
                -1px 1px 0 #2a1a0a;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 0.5vh;
            transform: translateY(1vh);
        }

        .current-score-digits {
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            font-size: clamp(47px, 11.4vw, 88px); 
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #000000,
                -3px -3px 0 #000000,
                3px -3px 0 #000000,
                -3px 3px 0 #000000,
                0 3px 0 #000000,
                3px 0 0 #000000,
                0 -3px 0 #000000,
                -3px 0 0 #000000;
            line-height: 1;
            margin-top: 3vh;
        }

        .skill-status {
            font-family: 'PressStart2P', 'Press Start 2P', monospace;
            font-size: 10px;
            color: #ffd700;
            min-height: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000000;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite alternate;
            margin-top: 2px;
        }

        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; text-shadow: 0 0 8px #ffd700; }
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 10px;
            margin-top: -10vh;
            position: relative;
            z-index: 10;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 1px;
            background-color: rgba(26, 40, 62, 0.94);
            padding: 4px;
            border-radius: 10px;
            width: 95vw;
            max-width: 385px;
            aspect-ratio: 1 / 1;
            border-top: 1.5px solid rgba(255, 255, 255, 0.25);
            border-left: 1.5px solid rgba(255, 255, 255, 0.25);
            border-right: 1.5px solid rgba(0, 0, 0, 0.7);
            border-bottom: 1.5px solid rgba(0, 0, 0, 0.7);
            box-shadow: 
                inset 3px 3px 6px rgba(255, 255, 255, 0.08),
                inset -3px -3px 6px rgba(0, 0, 0, 0.9),
                0 10px 25px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }

        .cell {
            background-color: rgba(38, 56, 84, 0.9);
            border-radius: 3px;
            border-top: 1px solid rgba(0, 0, 0, 0.5);
            border-left: 1px solid rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 1px 1px 3px rgba(0, 0, 0, 0.7),
                inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transition: background-color 0.1s, transform 0.1s;
            overflow: hidden;
        }

        /* Struttura del Blocco Gemma 3D */
        .block-cell {
            position: relative;
            width: var(--cell-size, 100%);
            height: var(--cell-size, 100%);
            background-color: var(--c-center); /* Colore centrale come fallback */
            border-radius: 15%;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--border-joint); /* Bordo sottile ed elegante tra i blocchi */
            pointer-events: none;
            filter: saturate(1.35) contrast(1.1);
        }

        /* Sfaccettature (Bevel 3D) */
        .facet {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Faccia Superiore (Trapezoide) */
        .facet.top { 
            clip-path: polygon(0 0, 100% 0, 85% 15%, 15% 15%); 
            background: var(--c-top); 
        }

        /* Faccia Sinistra (Trapezoide - Riceve più luce) */
        .facet.left { 
            clip-path: polygon(0 0, 0 100%, 15% 85%, 15% 15%); 
            background: var(--c-left); 
        }

        /* Faccia Destra (Trapezoide - In ombra) */
        .facet.right { 
            clip-path: polygon(100% 0, 100% 100%, 85% 85%, 85% 15%); 
            background: var(--c-right); 
        }

        /* Faccia Inferiore (Trapezoide - In ombra marcata) */
        .facet.bottom { 
            clip-path: polygon(0 100%, 100% 100%, 85% 85%, 15% 85%); 
            background: var(--c-bottom); 
        }

        /* Quadrato Centrale (Top face rialzata e lucida) */
        .center-face {
            position: absolute;
            top: 15%; 
            left: 15%;
            width: 70%; 
            height: 70%;
            background: var(--c-center);
            border-radius: 10%;
            /* Gradiente per dare l'effetto cristallo/gommoso */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
        }

        .cell.preview {
            background-color: rgba(255, 255, 255, 0.25) !important;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5) !important;
        }

        .cell.preview-clear {
            box-shadow: 
                0 0 15px rgba(255,255,255,0.5), 
                inset 2px 2px 8px rgba(255,255,255,0.7), 
                inset -2px -2px 8px rgba(0,0,0,0.6) !important;
            transform: scale(1.08);
            z-index: 5;
            position: relative;
        }

        #tray {
            height: 20vh;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            max-width: 380px;
            margin: -16vh auto 0;
            padding: 5px 10px;
            position: relative;
            z-index: 50;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .tray-slot {
            width: 30.6vw;
            height: 30.6vw;
            max-width: 132px;
            max-height: 132px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .piece {
            display: flex;
            flex-direction: column;
            gap: var(--grid-gap);
            position: relative;
            z-index: 10;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .piece-row {
            display: flex;
            gap: var(--grid-gap);
        }

        .piece-block {
            width: 4.68vw;
            height: 4.68vw;
            min-width: 23px;
            min-height: 23px;
            max-width: 34px;
            max-height: 34px;
            border-radius: 4px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .piece.dragging {
            position: fixed;
            z-index: 1000;
            cursor: grabbing;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #no-space-overlay {
            position: absolute;
            top: 25%; left: 0; right: 0; bottom: 25%;
            background: rgba(15, 15, 25, 0.45);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #no-space-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .no-space-text {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(13px, 3.8vw, 19px);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 3px 3px 0px #ff3344, 6px 6px 0px #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 8px 16px;
            animation: noSpacePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes noSpacePop {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #game-over {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            font-family: 'Press Start 2P', monospace;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 2000;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-over.new-high-score {
            background-color: #38006b;
        }

        #bouncer {
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            transform: rotate(45deg);
            will-change: transform;
            filter: drop-shadow(4px 4px 0px #000000);
            z-index: 1;
            pointer-events: none;
        }

        #game-over.visible:not(.new-high-score) #bouncer {
            display: grid;
        }

        #game-over.visible {
            display: flex;
        }

        .go-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
        }

        .go-score-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px;
        }

        .go-crown {
            width: 110px;
            margin-bottom: 20px;
            filter: drop-shadow(4px 4px 0px #000000);
            object-fit: contain;
            opacity: 0;
            transform: scale(0.5);
            display: none;
            image-rendering: pixelated;
        }

        #game-over.new-high-score .go-crown {
            display: block;
        }

        .go-best-score-title {
            font-family: 'Press Start 2P', monospace;
            color: #ffd700;
            font-size: clamp(16px, 4.8vw, 30px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #c79500, 6px 6px 0px #000000;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            display: none;
        }

        #game-over.new-high-score .go-best-score-title {
            display: block;
        }

        .go-normal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(24px, 7.5vw, 42px);
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 
                4px 4px 0px #ff3344, 
                8px 8px 0px #990011,
                12px 12px 0px #000000;
            opacity: 0;
            margin-bottom: 30px;
            display: block;
        }

        #game-over.new-high-score .go-normal-title {
            display: none;
        }

        .go-score-label {
            font-family: 'Press Start 2P', monospace;
            color: #d8b4fe;
            font-size: clamp(11px, 3.2vw, 16px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000000;
            margin-bottom: 12px;
            opacity: 0;
            transform: scale(0.5);
        }

        .go-score-number {
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            font-size: clamp(34px, 9vw, 58px);
            font-weight: bold;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 4px 4px 0px #000000;
            opacity: 0;
            transform: scale(0.5);
        }

        .go-play-button {
            background-color: #2ecc71;
            width: 86px;
            height: 86px;
            border-radius: 0px;
            border: 4px solid #000000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 4px 4px 0px #abebc6, 
                inset -4px -4px 0px #1e9b57, 
                6px 6px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            margin-top: 25px;
        }

        .go-play-button:active {
            transform: translate(3px, 3px);
            box-shadow: 
                inset 4px 4px 0px #abebc6, 
                inset -4px -4px 0px #1e9b57, 
                3px 3px 0px #000000;
        }

        .go-play-icon {
            width: 0; 
            height: 0; 
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid #ffffff;
            margin-left: 6px;
            filter: drop-shadow(2px 2px 0px #000000);
        }

        @keyframes popIn {
            0% { 
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            70% { 
                transform: scale(1.1) translateY(0);
            }
            100% { 
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes dropBounce {
            0% { transform: translateY(-150px) scale(0.8); opacity: 0; }
            60% { transform: translateY(15px) scale(1.1); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.95); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #game-over.visible .go-normal-title {

    <script>
        const BOARD_SIZE = 8;
        const boardElement = document.getElementById('board');

        const highScoreElement = document.getElementById('maxScoreDisplay') || document.getElementById('high-score');

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        
        let boardState = [];
        let lastPlacedColor = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('blockBlast3DHighScore8x8')) || 0;
        let sessionStartHighScore = highScore;
        let achievedNewRecord = false;
        let hasTriggeredRecordScreen = false;
        let activePieces = [];
        
        let linesEliminated = 0;
        let skillDiscardActive = false;
        let skillRotateActive = false;
        let skillSingleActive = false;
        let turnHasDragged = false;
        let gameOver = false;

        if (highScoreElement) highScoreElement.textContent = highScore.toLocaleString();
        if (scoreElement) scoreElement.textContent = '0';

        function hexToHsl(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16) / 255;
            const g = parseInt(hex.substring(2, 4), 16) / 255;
            const b = parseInt(hex.substring(4, 6), 16) / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
        }

        const GEM_COLORS = {
            cyan:      { center: 'rgb(61, 183, 224)',  top: 'rgb(121, 203, 229)', left: 'rgb(91, 193, 226)',  right: 'rgb(45, 151, 188)',  bottom: 'rgb(32, 119, 150)' },
            blue:      { center: 'rgb(57, 91, 218)',   top: 'rgb(112, 140, 225)', left: 'rgb(83, 115, 221)',  right: 'rgb(39, 70, 181)',   bottom: 'rgb(26, 51, 146)' },
            purple:    { center: 'rgb(145, 82, 198)',  top: 'rgb(177, 132, 213)', left: 'rgb(160, 107, 205)', right: 'rgb(115, 60, 163)',  bottom: 'rgb(89, 42, 130)' },
            lime:      { center: 'rgb(81, 189, 65)',   top: 'rgb(132, 207, 119)', left: 'rgb(107, 198, 92)',  right: 'rgb(63, 154, 49)',   bottom: 'rgb(47, 121, 35)' },
            yellow:    { center: 'rgb(227, 170, 36)',  top: 'rgb(231, 193, 95)',  left: 'rgb(229, 180, 65)',  right: 'rgb(194, 139, 18)',  bottom: 'rgb(156, 110, 10)' },
            red:       { center: 'rgb(214, 57, 57)',   top: 'rgb(223, 113, 113)', left: 'rgb(219, 84, 84)',   right: 'rgb(178, 37, 37)',   bottom: 'rgb(142, 23, 23)' },
            orange:    { center: 'rgb(228, 115, 30)',  top: 'rgb(232, 152, 89)',  left: 'rgb(230, 134, 59)',  right: 'rgb(194, 91, 15)',   bottom: 'rgb(156, 69, 8)' },
            magenta:   { center: 'rgb(216, 62, 137)',  top: 'rgb(224, 116, 170)', left: 'rgb(220, 89, 152)',  right: 'rgb(180, 41, 108)',  bottom: 'rgb(144, 25, 82)' },
            teal:      { center: 'rgb(35, 184, 152)',  top: 'rgb(97, 202, 178)',  left: 'rgb(66, 193, 165)',  right: 'rgb(24, 150, 122)',  bottom: 'rgb(16, 116, 94)' },
            turquoise: { center: 'rgb(67, 204, 234)',  top: 'rgb(125, 215, 236)', left: 'rgb(96, 210, 235)',  right: 'rgb(43, 172, 199)',  bottom: 'rgb(26, 138, 162)' },
            indigo:    { center: 'rgb(101, 85, 215)',  top: 'rgb(145, 133, 222)', left: 'rgb(122, 109, 219)', right: 'rgb(75, 60, 182)',   bottom: 'rgb(54, 41, 146)' }
        };
        const COLORS = Object.values(GEM_COLORS);

        function getGemShades(colorObj) {
            if (!colorObj) return GEM_COLORS.cyan;
            if (typeof colorObj === 'object' && colorObj.center) return colorObj;
            if (typeof colorObj === 'string' && GEM_COLORS[colorObj]) return GEM_COLORS[colorObj];
            if (typeof colorObj === 'string' && (colorObj.startsWith('#') || colorObj.startsWith('rgb'))) {
                let [h, s, l] = hexToHsl(colorObj);
                s = Math.min(100, Math.round(s * 1.25));
                return {
                    center: `hsl(${h}, ${s}%, ${l}%)`,
                    top: `hsl(${h}, ${Math.min(100, s + 10)}%, ${Math.min(90, l + 18)}%)`,
                    left: `hsl(${h}, ${Math.min(100, s + 5)}%, ${Math.min(82, l + 9)}%)`,
                    right: `hsl(${h}, ${s}%, ${Math.max(10, l - 12)}%)`,
                    bottom: `hsl(${h}, ${s}%, ${Math.max(5, l - 22)}%)`
                };
            }
            return GEM_COLORS.cyan;
        }

        function createGemBlockHTML(colorObj) {
            const shades = getGemShades(colorObj);
            const style = `--c-center: ${shades.center}; --c-top: ${shades.top}; --c-left: ${shades.left}; --c-right: ${shades.right}; --c-bottom: ${shades.bottom};`;
            return `<div class="block-cell" style="${style}"><div class="facet top"></div><div class="facet left"></div><div class="facet right"></div><div class="facet bottom"></div><div class="center-face"></div></div>`;
        }

        function createGemBlock(colorObj) {
            const cell = document.createElement('div');
            cell.className = 'block-cell';
            const shades = getGemShades(colorObj);
            cell.style.setProperty('--c-top', shades.top);
            cell.style.setProperty('--c-left', shades.left);
            cell.style.setProperty('--c-right', shades.right);
            cell.style.setProperty('--c-bottom', shades.bottom);
            cell.style.setProperty('--c-center', shades.center);
            cell.innerHTML = `<div class="facet top"></div><div class="facet left"></div><div class="facet right"></div><div class="facet bottom"></div><div class="center-face"></div>`;
            return cell;
        }

        const BASE_SHAPES = [
            // Pezzo O 2x2
            { matrix: [[1,1],[1,1]] },
            // Pezzo O 3x3 Grande
            { matrix: [
                [1,1,1],
                [1,1,1],
                [1,1,1]
            ] },
            // Pezzi I 4x1 Orizzontale & Verticale
            { matrix: [[1,1,1,1]] },
            { matrix: [[1],[1],[1],[1]] },
            // Pezzi I 1x2, 1x3, 2x1, 3x1
            { matrix: [[1,1]] },
            { matrix: [[1,1,1]] },
            { matrix: [[1],[1]] },
            { matrix: [[1],[1],[1]] },
            // Pezzi L
            { matrix: [[1,0],[1,1]] },
            { matrix: [[0,1],[1,1]] },
            { matrix: [[1,1,1],[1,0,0]] },
            { matrix: [[1,1,1],[0,0,1]] },
            // Pezzi L 3x3 (Grandi: alto 3 e largo 3)
            { matrix: [
                [1,0,0],
                [1,0,0],
                [1,1,1]
            ] },
            { matrix: [
                [0,0,1],
                [0,0,1],
                [1,1,1]
            ] },
            { matrix: [
                [1,1,1],
                [1,0,0],
                [1,0,0]
            ] },
            { matrix: [
                [1,1,1],
                [0,0,1],
                [0,0,1]
            ] },
            // Pezzi J
            { matrix: [[1,1],[1,0]] },
            { matrix: [[1,1],[0,1]] },
            { matrix: [[1,0,0],[1,1,1]] },
            { matrix: [[0,0,1],[1,1,1]] },
            // Pezzi T
            { matrix: [[1,1,1],[0,1,0]] },
            { matrix: [[0,1,0],[1,1,1]] },
            { matrix: [[1,0],[1,1],[1,0]] },
            { matrix: [[0,1],[1,1],[0,1]] },
            // Pezzo S
            { matrix: [[0,1,1],[1,1,0]] },
            // Pezzo Z
            { matrix: [[1,1,0],[0,1,1]] }
        ];

        const SINGLE_DOT_SHAPE = { matrix: [[1]] };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initBoard() {
            boardElement.innerHTML = '';
            boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardElement.appendChild(cell);
                }
            }
            const vfxCanvas = document.createElement('canvas');
            vfxCanvas.id = 'vfx-canvas';
            boardElement.appendChild(vfxCanvas);

            particles = [];
            flashes = [];
            disintegrations = [];
            score = 0;
            linesEliminated = 0;
            skillDiscardActive = false;
            skillRotateActive = false;
            skillSingleActive = false;
            turnHasDragged = false;
            gameOver = false;
            highScore = parseInt(localStorage.getItem('blockBlast3DHighScore8x8')) || 0;
            if(highScoreElement) highScoreElement.textContent = highScore;
            sessionStartHighScore = highScore;
            achievedNewRecord = false;
            hasTriggeredRecordScreen = false;
            updateScore(0);
            updateSkillUI();
            skillStatus.textContent = '';
            const goBestScoreText = document.getElementById('go-best-score-text');
            if (goBestScoreText) goBestScoreText.textContent = highScore;
            spawnPieces(true);
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animateNumberValue(element, start, end, duration = 400) {
            if (!element) return;
            if (element._animFrameId) {
                cancelAnimationFrame(element._animFrameId);
            }

            let startVal;
            if (typeof start === 'number') {
                startVal = start;
            } else if (element._currentDisplayedValue !== undefined) {
                startVal = element._currentDisplayedValue;
            } else {
                startVal = parseInt(element.textContent) || 0;
            }

            if (startVal === end) {
                element.textContent = end;
                element._currentDisplayedValue = end;
                return;
            }

            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutCubic(progress);
                const currentVal = Math.round(startVal + (end - startVal) * easedProgress);

                element.textContent = currentVal;
                element._currentDisplayedValue = currentVal;

                if (progress < 1) {
                    element._animFrameId = requestAnimationFrame(update);
                } else {
                    element.textContent = end;
                    element._currentDisplayedValue = end;
                    element._animFrameId = null;
                }
            }

            element._animFrameId = requestAnimationFrame(update);
        }

        function renderBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = boardElement.children[r * BOARD_SIZE + c];
                    const color = boardState[r][c];
                    cell.className = 'cell';
                    if (color) {
                        cell.innerHTML = createGemBlockHTML(color);
                    } else {
                        cell.innerHTML = '';
                    }
                }
            }
        }

        function animateTextScore(container, targetScore, duration = 400) {
            if (!container) return;
            let startScore = parseInt(container.textContent.replace(/,/g, '')) || 0;
            const scoreDiff = targetScore - startScore;
            if (scoreDiff === 0) {
                container.textContent = targetScore.toLocaleString();
                return;
            }
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentValue = Math.round(startScore + (eased * scoreDiff));
                
                container.textContent = currentValue.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    container.textContent = targetScore.toLocaleString();
                }
            }
            requestAnimationFrame(update);
        }

        function updateScore(points) {
            score += points;
            
            const currentScoreDisplay = document.getElementById('currentScoreDisplay') || scoreElement;
            if (currentScoreDisplay) {
                animateTextScore(currentScoreDisplay, score, 400);
            }

            if (score > sessionStartHighScore) {
                achievedNewRecord = true;
                highScore = score;
                localStorage.setItem('blockBlast3DHighScore8x8', highScore);
                
                const maxScoreDisplay = document.getElementById('maxScoreDisplay') || highScoreElement;
                if (maxScoreDisplay) {
                    maxScoreDisplay.textContent = highScore.toLocaleString();
                }
            }
        }

        function showHighScoreScreen() {
            const goScoreText = document.getElementById('go-score-text');
            if(goScoreText) animateNumberValue(goScoreText, 0, score, 800);

            if(gameOverScreen) {
                gameOverScreen.classList.add('new-high-score');
                gameOverScreen.classList.remove('visible');
                void gameOverScreen.offsetWidth;
                gameOverScreen.classList.add('visible');
            }

            setTimeout(() => {
                if(typeof shootConfetti === 'function') shootConfetti();
                else if(typeof spawnConfetti === 'function') spawnConfetti();
            }, 100);
        }

        function canPieceFit(grid, pieceMatrix) {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (canPlace(pieceMatrix, r, c)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function isGridCritical(grid) {
            let filled = 0;
            const total = BOARD_SIZE * BOARD_SIZE;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (grid[r][c] !== null) filled++;
                }
            }
            return (filled / total) > 0.75;
        }

        function getRandomPieceShape(isCritical = false) {
            let shapes;
            if (isCritical) {
                shapes = [
                    SINGLE_DOT_SHAPE,
                    { matrix: [[1,1]] },
                    { matrix: [[1],[1]] },
                    { matrix: [[1,1],[1,1]] }
                ];
            } else {
                shapes = [...BASE_SHAPES];
                if (typeof skillSingleActive !== 'undefined' && skillSingleActive) shapes.push(SINGLE_DOT_SHAPE);
            }
            const selected = shapes[Math.floor(Math.random() * shapes.length)];
            const colorList = Object.values(GEM_COLORS);
            const randomColor = colorList[Math.floor(Math.random() * colorList.length)];
            return {
                matrix: selected.matrix.map(row => [...row]),
                color: randomColor
            };
        }

        function generateThreePieces(currentGrid) {
            const pieces = [];
            const maxRerolls = 5;

            for (let i = 0; i < 3; i++) {
                let candidatePiece = getRandomPieceShape(false);
                let attempts = 0;

                while (!canPieceFit(currentGrid, candidatePiece.matrix) && attempts < maxRerolls) {
                    if (isGridCritical(currentGrid)) {
                        candidatePiece = getRandomPieceShape(true);
                    } else {
                        candidatePiece = getRandomPieceShape(false);
                    }
                    attempts++;
                }

                pieces.push(candidatePiece);
            }

            return pieces;
        }

        function getAvailableShapes() {
            let shapes = [...BASE_SHAPES];
            if (typeof skillSingleActive !== 'undefined' && skillSingleActive) shapes.push(SINGLE_DOT_SHAPE);
            return shapes;
        }

        function spawnPieces(all = false) {
            turnHasDragged = false;

            if (all || activePieces.length === 0) {
                activePieces = [];
                const newPieces = generateThreePieces(boardState);
                for (let i = 0; i < 3; i++) {
                    const shape = newPieces[i];
                    createPieceElement(shape, i);
                    activePieces.push({ shape, slot: i, rotated: false });
                }
            }
            updateSkillUI();
            checkGameOver();
        }

        function updateSkillUI() {
            let dots = linesEliminated % 6;
            const isFull = (linesEliminated > 0 && dots === 0);
            const filledCount = isFull ? 6 : dots;

            for (let i = 1; i <= 6; i++) {
                const blockImg = document.getElementById(`block-${i}`);
                if (blockImg) {
                    if (i <= filledCount) {
                        blockImg.src = 'assets/Gemini_Generated_Image_rki7ferki7ferki7-removebg-preview.png';
                        blockImg.className = 'block green';
                    } else {
                        blockImg.src = 'assets/Pasted_image-removebg-preview.png';
                        blockImg.className = 'block blue';
                    }
                }
            }

            const nextThreshold = (Math.floor(linesEliminated / 6) + 1) * 6;
            const linesClearedText = document.getElementById('linesClearedText');
            if (linesClearedText) {
                linesClearedText.textContent = `${linesEliminated}/${nextThreshold}`;
            }

            if (skillStatus) {
                if (skillDiscardActive && !turnHasDragged) {
                    skillStatus.textContent = 'Cambiare Pezzo? (Tap)';
                } else if (skillRotateActive) {
                    skillStatus.textContent = 'Doppio Tap per Ruotare!';
                } else if (skillSingleActive) {
                    skillStatus.textContent = 'Punto Singolo Sbloccato!';
                } else {
                    skillStatus.textContent = '';
                }
            }
        }

        function grantSkill() {
            const plusOneEl = document.getElementById('coinPlusOne');
            if (plusOneEl) {
                plusOneEl.classList.remove('show');
                void plusOneEl.offsetWidth;
                plusOneEl.classList.add('show');
            }

            const rand = Math.random();
            if (rand < 0.33 && !skillSingleActive) {
                skillSingleActive = true;
                if(skillStatus) skillStatus.textContent = 'Punto Singolo Sbloccato!';
            } else if (rand < 0.66) {
                skillRotateActive = true;
                if(skillStatus) skillStatus.textContent = 'Doppio Tap per Ruotare!';
            } else {
                skillDiscardActive = true;
                if(skillStatus) skillStatus.textContent = 'Cambiare Pezzo? (Tap)';
            }
            updateSkillUI();
        }

        function rotateMatrix(matrix) {
            const rows = matrix.length;
            const cols = matrix[0].length;
            let result = Array.from({length: cols}, () => Array(rows).fill(0));
            for(let r=0; r<rows; r++){
                for(let c=0; c<cols; c++){
                    result[c][rows - 1 - r] = matrix[r][c];
                }
            }
            return result;
        }

        let dragState = null;
        let lastPreviewRow = -1;
        let lastPreviewCol = -1;

        function clearPreview() {
            renderBoard();
            lastPreviewRow = -1;
            lastPreviewCol = -1;
        }

        function showPreview(shape, row, col) {
            clearPreview();
            
            let tempBoard = boardState.map(r => [...r]);
            for(let r=0; r<shape.matrix.length; r++){
                for(let c=0; c<shape.matrix[r].length; c++){
                    if(shape.matrix[r][c]){
                        tempBoard[row+r][col+c] = shape.color;
                    }
                }
            }

            let rowsToClear = [];
            let colsToClear = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (tempBoard[r].every(val => val !== null)) rowsToClear.push(r);
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (tempBoard.every(r => r[c] !== null)) colsToClear.push(c);
            }

            for(let r=0; r<shape.matrix.length; r++){
                for(let c=0; c<shape.matrix[r].length; c++){
                    if(shape.matrix[r][c]){
                        const cell = boardElement.children[(row+r) * BOARD_SIZE + (col+c)];
                        if(cell) {
                            cell.classList.add('preview');
                            cell.innerHTML = createGemBlockHTML(shape.color);
                            const gem = cell.querySelector('.block-cell');
                            if (gem) gem.style.opacity = '0.4';
                        }
                    }
                }
            }

            rowsToClear.forEach(r => {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = boardElement.children[r * BOARD_SIZE + c];
                    if(cell) {
                        cell.classList.add('preview-clear');
                        cell.innerHTML = createGemBlockHTML(shape.color);
                    }
                }
            });
            colsToClear.forEach(c => {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    const cell = boardElement.children[r * BOARD_SIZE + c];
                    if(cell) {
                        cell.classList.add('preview-clear');
                        cell.innerHTML = createGemBlockHTML(shape.color);
                    }
                }
            });
            lastPreviewRow = row;
            lastPreviewCol = col;
        }

        function resetPieceElementStyle(el) {
            if (!el) return;
            el.classList.remove('dragging');
            el.style.position = '';
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.transform = '';
        }

        function resetPieceElementStyle(el) {
            if (!el) return;
            el.classList.remove('dragging');
            el.style.position = '';
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.transform = '';
            el.style.transformOrigin = '';
        }

        function createPieceElement(shape, slotIndex, rotated = false) {
            const slot = document.getElementById(`slot-${slotIndex}`);
            if (!slot) return;
            slot.innerHTML = '';
            
            const pieceEl = document.createElement('div');
            pieceEl.classList.add('piece');
            pieceEl.dataset.slot = slotIndex;
            
            shape.matrix.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.classList.add('piece-row');
                row.forEach(val => {
                    const block = document.createElement('div');
                    block.classList.add('piece-block');
                    if (val) {
                        block.innerHTML = createGemBlockHTML(shape.color);
                    } else {
                        block.style.backgroundColor = 'transparent';
                    }
                    rowEl.appendChild(block);
                });
                pieceEl.appendChild(rowEl);
            });

            slot.appendChild(pieceEl);

            let startX = 0, startY = 0;
            let lastTap = 0;

            pieceEl.addEventListener('pointerdown', (e) => {
                if (gameOver) return;
                if (e.cancelable) e.preventDefault();

                if (dragState && dragState.element) {
                    resetPieceElementStyle(dragState.element);
                }
                dragState = null;
                clearPreview();

                try {
                    pieceEl.setPointerCapture(e.pointerId);
                } catch (err) {}

                startX = e.clientX;
                startY = e.clientY;

                const rect = pieceEl.getBoundingClientRect();
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;

                dragState = {
                    element: pieceEl,
                    slotIndex,
                    shape,
                    offsetX,
                    offsetY,
                    hasMoved: false,
                    startX,
                    startY,
                    pointerId: e.pointerId
                };

                window.addEventListener('pointermove', onDrag, { passive: false });
                window.addEventListener('pointerup', onPointerUp, { passive: false });
                window.addEventListener('pointercancel', onPointerUp, { passive: false });
            });

            function onPointerUp(e) {
                window.removeEventListener('pointermove', onDrag);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('pointercancel', onPointerUp);

                if (e && e.pointerId !== undefined && pieceEl.hasPointerCapture && pieceEl.hasPointerCapture(e.pointerId)) {
                    try {
                        pieceEl.releasePointerCapture(e.pointerId);
                    } catch (err) {}
                }

                if (!dragState || dragState.element !== pieceEl) return;

                const { element, hasMoved, slotIndex: currentSlot } = dragState;

                if (!hasMoved) {
                    dragState = null;
                    const now = Date.now();
                    const isDoubleTap = (now - lastTap) < 300;
                    lastTap = now;

                    const pieceData = activePieces.find(p => p.slot === currentSlot);
                    
                    if (isDoubleTap && skillRotateActive && pieceData && !pieceData.rotated) {
                        pieceData.shape.matrix = rotateMatrix(pieceData.shape.matrix);
                        pieceData.rotated = true;
                        createPieceElement(pieceData.shape, currentSlot, true);
                        checkGameOver();
                        return;
                    }

                    if (skillDiscardActive && !turnHasDragged && !isDoubleTap) {
                        const newShape = getRandomPieceShape();
                        if (pieceData) {
                            pieceData.shape = newShape;
                            pieceData.rotated = false;
                            createPieceElement(newShape, currentSlot);
                            skillDiscardActive = false;
                            updateSkillUI();
                            checkGameOver();
                        }
                        return;
                    }
                    return;
                }

                turnHasDragged = true;
                updateSkillUI();

                let targetRow = -1;
                let targetCol = -1;
                if (lastPreviewRow !== -1 && lastPreviewCol !== -1 && canPlace(dragState.shape.matrix, lastPreviewRow, lastPreviewCol)) {
                    targetRow = lastPreviewRow;
                    targetCol = lastPreviewCol;
                } else {
                    const scaledRect = element.getBoundingClientRect();
                    const boardRect = boardElement.getBoundingClientRect();
                    const cellWidth = boardRect.width / BOARD_SIZE;
                    const cellHeight = boardRect.height / BOARD_SIZE;

                    const dropX = scaledRect.left - boardRect.left;
                    const dropY = scaledRect.top - boardRect.top;

                    const col = Math.floor((dropX + cellWidth * 0.25) / cellWidth);
                    const row = Math.floor((dropY + cellHeight * 0.25) / cellHeight);

                    if (canPlace(dragState.shape.matrix, row, col)) {
                        targetRow = row;
                        targetCol = col;
                    }
                }

                clearPreview();
                resetPieceElementStyle(element);

                if (targetRow !== -1 && targetCol !== -1) {
                    placePiece(dragState.shape, targetRow, targetCol);
                    element.remove();
                    activePieces = activePieces.filter(p => p.slot !== currentSlot);
                    
                    checkLines();
                    spawnPieces();
                }

                dragState = null;
            }
        }

        function onDrag(e) {
            if (!dragState) return;

            const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
            if (!dragState.hasMoved && dist > 3) {
                dragState.hasMoved = true;
                const el = dragState.element;
                const rect = el.getBoundingClientRect();
                el.style.width = `${rect.width}px`;
                el.style.height = `${rect.height}px`;
                el.classList.add('dragging');
                el.style.position = 'fixed';
                el.style.transformOrigin = `${dragState.offsetX}px ${dragState.offsetY}px`;
            }

            if (dragState.hasMoved) {
                if (e.cancelable) e.preventDefault();
                const boardRect = boardElement.getBoundingClientRect();
                const cellWidth = boardRect.width / BOARD_SIZE;
                const cellHeight = boardRect.height / BOARD_SIZE;
                
                const pieceFirstBlock = dragState.element.querySelector('.piece-block');
                const pieceBlockWidth = pieceFirstBlock ? pieceFirstBlock.offsetWidth : cellWidth;
                const scaleFactor = pieceBlockWidth > 0 ? (cellWidth / pieceBlockWidth) : 1;

                const el = dragState.element;
                el.style.left = `${e.clientX - dragState.offsetX}px`;
                el.style.top = `${e.clientY - dragState.offsetY}px`;
                el.style.transform = `scale(${scaleFactor}) translateY(-70px)`;

                const scaledRect = el.getBoundingClientRect();
                const dropX = scaledRect.left - boardRect.left;
                const dropY = scaledRect.top - boardRect.top;
                
                const col = Math.floor((dropX + cellWidth * 0.25) / cellWidth);
                const row = Math.floor((dropY + cellHeight * 0.25) / cellHeight);

                if (row !== lastPreviewRow || col !== lastPreviewCol) {
                    lastPreviewRow = row;
                    lastPreviewCol = col;
                    if (canPlace(dragState.shape.matrix, row, col)) {
                        showPreview(dragState.shape, row, col);
                    } else {
                        clearPreview();
                    }
                }
            }
        }

        function canPlace(matrix, row, col) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c]) {
                        const targetRow = row + r;
                        const targetCol = col + c;
                        if (targetRow < 0 || targetRow >= BOARD_SIZE || targetCol < 0 || targetCol >= BOARD_SIZE) {
                            return false;
                        }
                        if (boardState[targetRow][targetCol] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placePiece(shape, row, col) {
            lastPlacedColor = shape.color;
            let blocksPlaced = 0;
            for (let r = 0; r < shape.matrix.length; r++) {
                for (let c = 0; c < shape.matrix[r].length; c++) {
                    if (shape.matrix[r][c]) {
                        boardState[row + r][col + c] = shape.color;
                        blocksPlaced++;
                    }
                }
            }
            updateScore(blocksPlaced);
            renderBoard();
        }
