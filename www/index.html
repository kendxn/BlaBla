<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="game-container">
        <!-- Top Bar: Crown - MAX SCORE - Settings -->
        <div class="top-bar">
            <img src="assets/Gemini_Generated_Image_41xbxx41xbxx41xb-removebg-preview.png" alt="bar" class="top-bar-bg">
            <div class="top-bar-content">
                <img src="assets/Gemini_Generated_Image_wbdnqbwbdnqbwbdn-removebg-preview.png" alt="crown" class="icon-crown">
                <div class="max-score-text">
                    <span class="score-value" id="maxScoreDisplay">0</span>
                </div>
                <img src="assets/Gemini_Generated_Image_ooep2eooep2eooep-removebg-preview.png" alt="settings" class="icon-settings" id="btnSettings">
            </div>
        </div>

        <!-- Lines Cleared Section -->
        <div class="lines-section">
            <div class="lines-label">LINES CLEARED: <span id="linesClearedText">0/6</span></div>
            <div class="lines-blocks" id="linesBlocksContainer">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-1">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-2">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-3">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-4">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-5">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-6">
                
                <div class="coin-container">
                    <img src="assets/Gemini_Generated_Image_5zcunn5zcunn5zcu-removebg-preview.png" alt="coins" class="coins-icon">
                    <div id="coinPlusOne" class="coin-plus-one">+1</div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Skills - Current Score (Centered) - Shop -->
        <div class="bottom-section">
            <img src="assets/image-removebg-preview.png" alt="Skills" class="btn-skills" id="btnSkills">
            
            <div class="current-score-area">
                <div class="current-score-label">CURRENT SCORE</div>
                <div class="current-score-digits" id="currentScoreDisplay">0</div>
                <div class="skill-status" id="skill-status"></div>
            </div>

            <img src="assets/image-removebg-preview(1).png" alt="Shop" class="btn-shop" id="btnShop">
        </div>
    </div>

    <main>
        <div id="board"></div>
    </main>

    <div id="tray">
        <div class="tray-slot" id="slot-0"></div>
        <div class="tray-slot" id="slot-1"></div>
        <div class="tray-slot" id="slot-2"></div>
    </div>

    <div id="game-over">
        <canvas id="confetti-canvas"></canvas>
        <div id="bouncer"></div>
        <div class="go-container">
            <div class="go-score-group">
                <h1 class="go-normal-title">Game Over</h1>
                <img src="https://z-cdn-media.chatglm.cn/files/cd783802-0d77-4a2a-a1cd-be461209e134.png?auth_key=1889038769-5d2e59c7f2b949aa95db73113efcbc29-0-803c51fbf5c9fc13345f9e1fc52eaa0a" alt="Corona" class="go-crown">
                <div class="go-best-score-title">Best Score!</div>
                <div class="go-score-label">Score</div>
                <div id="go-score-text" class="go-score-number">0</div>
            </div>

            <button id="play-btn" class="go-play-button">
                <div class="go-play-icon"></div>
            </button>
        </div>
    </div>

    <!-- Script organizzati a moduli logici -->
    <script src="js/grid.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/drag-drop.js"></script>
</body>
</html>
