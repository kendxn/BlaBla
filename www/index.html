<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-container">
        <!-- LIVELLO 1: Riga Superiore -->
        <div class="level-1">
            <!-- Sinistra: Corona + Punteggio Massimo -->
            <div class="max-score-wrapper">
                <svg class="crown-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm0 2h14v2H5v-2z"/>
                </svg>
                <span id="high-score" class="max-score-value">0</span>
            </div>

            <!-- Destra: Icona Impostazioni -->
            <div class="settings-wrapper">
                <svg class="gear-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49-.12-.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
            </div>
        </div>

        <!-- LIVELLO 2: Barra di avanzamento -->
        <div class="level-2">
            <div class="lines-bar">
                <div class="dot" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div>
                <div class="dot" id="dot-4"></div>
                <div class="dot" id="dot-5"></div>
                <div class="dot" id="dot-6"></div>
            </div>
            <span id="lines-text" class="lines-text">0 / 6</span>
        </div>

        <!-- LIVELLO 3: Punteggio Attuale -->
        <div id="score" class="current-score">0</div>
        
        <div class="skill-status" id="skill-status"></div>
    </header>

    <main>
        <div id="board"></div>
    </main>

    <div id="tray">
        <div class="tray-slot" id="slot-0"></div>
        <div class="tray-slot" id="slot-1"></div>
        <div class="tray-slot" id="slot-2"></div>
    </div>

    <div id="game-over">
        <canvas id="confetti-canvas"></canvas>
        <div id="bouncer"></div>
        <div class="go-container">
            <div class="go-score-group">
                <h1 class="go-normal-title">Game Over</h1>
                <img src="https://z-cdn-media.chatglm.cn/files/cd783802-0d77-4a2a-a1cd-be461209e134.png?auth_key=1889038769-5d2e59c7f2b949aa95db73113efcbc29-0-803c51fbf5c9fc13345f9e1fc52eaa0a" alt="Corona" class="go-crown">
                <div class="go-best-score-title">Best Score!</div>
                <div class="go-score-label">Score</div>
                <div id="go-score-text" class="go-score-number">0</div>
            </div>

            <button id="play-btn" class="go-play-button">
                <div class="go-play-icon"></div>
            </button>
        </div>
    </div>

    <!-- Script organizzati a moduli logici -->
    <script src="js/grid.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/drag-drop.js"></script>
</body>
</html>
