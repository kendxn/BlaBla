<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app-wrapper">
        <div class="game-container">
            <!-- Top Bar: Crown - MAX SCORE - Settings -->
            <div class="top-bar">
                <img src="assets/top_bar_bg.png" alt="bar" class="top-bar-bg">
                <div class="top-bar-content">
                    <img src="assets/crown_icon.png" alt="crown" class="icon-crown">
                    <div class="max-score-text">
                        <span class="score-value" id="maxScoreDisplay">0</span>
                    </div>
                    <img src="assets/settings_icon.png" alt="settings" class="icon-settings" id="btnSettings">
                </div>
            </div>

            <!-- Lines Cleared Section -->
            <div class="lines-section">
                <div class="lines-blocks" id="linesBlocksContainer">
                    <div class="lines-count-banner">
                        <span id="linesClearedText" class="lines-count-inline">0/3</span>
                    </div>

                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-1">
                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-2">
                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-3">
                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-4">
                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-5">
                    <img src="assets/line_block_empty.png" alt="empty" class="block blue" id="block-6">

                    <div class="coin-container">
                        <img src="assets/coin_icon.png" alt="coins" class="coins-icon">
                        <div class="coin-banner-box">
                            <span class="coin-count-number" id="linesCoinDisplay">0</span>
                        </div>
                        <div id="coinPlusOne" class="coin-plus-one">+1</div>
                    </div>
                </div>
            </div>

            <!-- Bottom Section: Skills - Current Score (Centered) - Shop -->
            <div class="bottom-section">
                <img src="assets/btn_skills.png" alt="Skills" class="btn-skills" id="btnSkills">
                
                <div class="current-score-area">
                    <div class="score-display-wrapper">
                        <img src="assets/score_display_bg.png" alt="Current Score" class="score-display-bg">
                        <div class="current-score-digits" id="currentScoreDisplay">0</div>
                    </div>
                </div>

                <img src="assets/btn_shop.png" alt="Shop" class="btn-shop" id="btnShop">
            </div>
        </div>

        <main>
            <div id="board"></div>
        </main>

        <div id="tray">
            <div class="tray-slot" id="slot-0"></div>
            <div class="tray-slot" id="slot-1"></div>
            <div class="tray-slot" id="slot-2"></div>
        </div>
        <div class="skill-status" id="skill-status"></div>
    </div>

    <div id="game-over">
        <canvas id="confetti-canvas"></canvas>
        <div id="bouncer"></div>
        <div class="go-container">
            <div class="go-score-group">
                <h1 class="go-normal-title">Game Over</h1>
                <img src="https://z-cdn-media.chatglm.cn/files/cd783802-0d77-4a2a-a1cd-be461209e134.png?auth_key=1889038769-5d2e59c7f2b949aa95db73113efcbc29-0-803c51fbf5c9fc13345f9e1fc52eaa0a" alt="Corona" class="go-crown">
                <div class="go-best-score-title">Best Score!</div>
                <div class="go-score-label">Score</div>
                <div id="go-score-text" class="go-score-number">0</div>
            </div>

            <button id="play-btn" class="go-play-button">
                <div class="go-play-icon"></div>
            </button>
        </div>
    </div>

    <!-- Modal In-Game Custom (Settings / Skills / Shop) -->
    <div id="gameModal" class="custom-modal-overlay hidden">
        <div class="custom-modal-box">
            <h2 id="modalTitle" class="custom-modal-title">IMPOSTAZIONI</h2>
            <div id="modalBody" class="custom-modal-body"></div>
            <button id="modalCloseBtn" class="custom-modal-btn btn-close">CHIUDI</button>
        </div>
    </div>

    <!-- Script organizzati a moduli logici -->
    <script src="js/grid.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/drag-drop.js"></script>
    <script src="js/crt-effect.js"></script>
    <script>
        if (typeof initBoard === 'function') {
            initBoard();
        }
    </script>
</body>
</html>
