<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Negozio Blast - Pixel Art Game UI">
    <title>Negozio Blast - Game UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Background grid removed, now applied directly to body -->

        <!-- Top Bar: Crown - MAX SCORE - Settings -->
        <div class="top-bar">
            <img src="assets/Gemini_Generated_Image_41xbxx41xbxx41xb-removebg-preview.png" alt="bar" class="top-bar-bg">
            <div class="top-bar-content">
                <img src="assets/Gemini_Generated_Image_wbdnqbwbdnqbwbdn-removebg-preview.png" alt="crown" class="icon-crown">
                <div class="max-score-text">
                    <span class="score-value" id="maxScoreDisplay"></span>
                </div>
                <img src="assets/Gemini_Generated_Image_ooep2eooep2eooep-removebg-preview.png" alt="settings" class="icon-settings">
            </div>
        </div>

        <!-- Lines Cleared Section -->
        <div class="lines-section">
            <div class="lines-label">LINES CLEARED: <span id="linesClearedText">4/6</span></div>
            <div class="lines-blocks">
                <img src="assets/Gemini_Generated_Image_rki7ferki7ferki7-removebg-preview.png" alt="filled" class="block green">
                <img src="assets/Gemini_Generated_Image_rki7ferki7ferki7-removebg-preview.png" alt="filled" class="block green">
                <img src="assets/Gemini_Generated_Image_rki7ferki7ferki7-removebg-preview.png" alt="filled" class="block green">
                <img src="assets/Gemini_Generated_Image_rki7ferki7ferki7-removebg-preview.png" alt="filled" class="block green">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-5">
                <img src="assets/Pasted_image-removebg-preview.png" alt="empty" class="block blue" id="block-6">
                
                <div class="coin-container">
                    <img src="assets/Gemini_Generated_Image_5zcunn5zcunn5zcu-removebg-preview.png" alt="coins" class="coins-icon">
                    <div id="coinPlusOne" class="coin-plus-one">+1</div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Skills - Current Score (Centered) - Shop -->
        <div class="bottom-section">
            <img src="assets/image-removebg-preview.png" alt="Skills" class="btn-skills" id="btnSkills">
            
            <div class="current-score-area">
                <div class="current-score-label">CURRENT SCORE</div>
                <div class="current-score-digits" id="currentScoreDisplay">15,740</div>
            </div>

            <img src="assets/image-removebg-preview(1).png" alt="Shop" class="btn-shop" id="btnShop">
        </div>

        <!-- Sparkle effects removed as requested -->
    </div>

    <script src="script.js"></script>
</body>
</html>
