<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Roguelite UI - Pixel Perfect</title>
    <!-- Font stile arcade -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Colori Esatta */
            --bg-base: #142850;
            --bg-grid: #1e3a6c;
            --border-dark: #201a1c; /* Marrone molto scuro/nero per i bordi */
            
            /* Top Bar */
            --top-bg: #eab483;
            --top-highlight: #fde4c4;
            --top-shadow: #c17b53;
            
            /* Middle - Blocks */
            --block-green-bg: #6fb682;
            --block-green-hi: #a0ddad;
            --block-green-sh: #427c54;
            --block-empty-bg: #152955;
            --block-empty-border: #234586;
            
            /* Bottom - Buttons */
            --btn-skills-bg: #a3d99f;
            --btn-skills-hi: #d1f3ce;
            --btn-skills-sh: #6fa96c;
            
            --btn-shop-bg: #e49774;
            --btn-shop-hi: #fad4bf;
            --btn-shop-sh: #b4573b;
            
            /* Score */
            --score-main: #f0ba93;
            --score-dark: #4a271c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            /* Forza il rendering nitido */
            -webkit-font-smoothing: none; 
            image-rendering: pixelated; 
        }

        /* Schermo di gioco con griglia */
        .game-screen {
            width: 720px;
            height: 420px;
            background-color: var(--bg-base);
            background-image: 
                linear-gradient(var(--bg-grid) 3px, transparent 3px),
                linear-gradient(90deg, var(--bg-grid) 3px, transparent 3px);
            background-size: 40px 40px;
            background-position: top left;
            border: 14px solid #1a1a1a;
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            /* Ombra interna per dare profondità allo schermo */
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }

        /* ================= LIVELLO 1: TOP BAR ================= */
        .top-bar {
            background-color: var(--top-bg);
            /* Bordo netto pixel art + ombre interne per luce/ombra */
            border: 4px solid var(--border-dark);
            border-radius: 8px;
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Ombra scura esterna in basso (effetto chunky) + Ombre interne (highlight in alto, scuro in basso) */
            box-shadow: 
                0 6px 0 var(--border-dark),
                inset 0 4px 0 var(--top-highlight), 
                inset 0 -5px 0 var(--top-shadow);
            margin-bottom: 25px;
        }

        .max-score-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-text {
            font-size: 36px;
            color: var(--border-dark);
            text-transform: uppercase;
            /* Leggera ombreggiatura per replicare il dithering del font */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.3);
            margin-top: 4px;
        }

        .icon-placeholder {
            font-family: sans-serif;
            font-size: 32px;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
        }

        /* ================= LIVELLO 2: PROGRESS BAR ================= */
        .middle-section {
            text-align: center;
        }

        .lines-cleared-text {
            color: white;
            font-size: 32px;
            text-shadow: 2px 2px 0px #000, 3px 3px 0px #000;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .block {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            border: 3px solid var(--border-dark);
        }

        .block.filled {
            background-color: var(--block-green-bg);
            /* Highlight interno verde chiaro in alto e a sinistra, ombra verde scuro in basso e a destra */
            box-shadow: 
                inset 3px 3px 0 var(--block-green-hi),
                inset -3px -3px 0 var(--block-green-sh);
            /* Motivo a mattoncino base */
            background-image: 
                linear-gradient(transparent 45%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.15) 55%, transparent 55%),
                linear-gradient(90deg, transparent 45%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.15) 55%, transparent 55%);
        }

        .block.empty {
            background-color: var(--block-empty-bg);
            border-color: #000;
            box-shadow: inset 0 0 0 3px var(--block-empty-border);
        }

        .coins-icon {
            font-size: 40px;
            margin-left: 15px;
            filter: drop-shadow(3px 3px 0px #000);
        }

        /* ================= LIVELLO 3: BOTTOM SECTION ================= */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
        }

        /* Pulsanti Chunky */
        .btn {
            width: 110px;
            height: 125px;
            border: 4px solid var(--border-dark);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            /* L'ombra esterna nera simula lo spessore 3D, le inset danno il volume alla faccia superiore */
            box-shadow: 0 8px 0 var(--border-dark);
            transform: translateY(0);
            transition: all 0.05s linear;
            margin-bottom: 8px; /* Per far spazio all'ombra */
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--border-dark);
        }

        .skills-btn {
            background-color: var(--btn-skills-bg);
            box-shadow: 
                0 8px 0 var(--border-dark),
                inset 0 4px 0 var(--btn-skills-hi), 
                inset 0 -6px 0 var(--btn-skills-sh);
        }
        
        .skills-btn:active {
            box-shadow: 
                0 2px 0 var(--border-dark),
                inset 0 4px 0 var(--btn-skills-hi), 
                inset 0 -6px 0 var(--btn-skills-sh);
        }

        .shop-btn {
            background-color: var(--btn-shop-bg);
            box-shadow: 
                0 8px 0 var(--border-dark),
                inset 0 4px 0 var(--btn-shop-hi), 
                inset 0 -6px 0 var(--btn-shop-sh);
        }

        .shop-btn:active {
            box-shadow: 
                0 2px 0 var(--border-dark),
                inset 0 4px 0 var(--btn-shop-hi), 
                inset 0 -6px 0 var(--btn-shop-sh);
        }

        .btn-text {
            font-size: 26px;
            color: var(--border-dark);
            letter-spacing: 1px;
            margin-top: auto;
            margin-bottom: 5px;
        }

        .btn-icon-art {
            font-size: 50px;
            margin-top: 15px;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.6));
        }

        /* Punteggio */
        .current-score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: -5px;
        }

        .current-score-title {
            color: white;
            font-size: 30px;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: -5px;
            letter-spacing: 2px;
        }

        .current-score-number {
            color: var(--score-main);
            font-size: 110px;
            line-height: 1;
            /* Riproduzione esatta dell'effetto a strati: bordo bianco attorno, ombra marrone/rossiccia per lo spessore e ombra nera alla base */
            text-shadow: 
                /* Contorno bianco */
                -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 2px 2px 0px #fff,
                -3px 0px 0px #fff, 3px 0px 0px #fff, 0px -3px 0px #fff, 0px 3px 0px #fff,
                /* Spessore 3D Marrone/Rosso */
                3px 4px 0px var(--score-dark), 4px 5px 0px var(--score-dark), 5px 6px 0px var(--score-dark), 6px 7px 0px var(--score-dark),
                /* Ombra Nera Base */
                6px 10px 0px #000;
        }
    </style>
</head>
<body>

    <div class="game-screen">
        
        <!-- LIVELLO 1 -->
        <div class="top-bar">
            <div class="max-score-container">
                <div class="icon-placeholder">👑</div>
                <div class="top-text">MAX SCORE:</div>
            </div>
            <div class="max-score-container">
                <div class="top-text">48,320</div>
                <div class="icon-placeholder">⚙️</div>
            </div>
        </div>

        <!-- LIVELLO 2 -->
        <div class="middle-section">
            <div class="lines-cleared-text">LINES CLEARED: 4/6</div>
            <div class="progress-container">
                <div class="block filled"></div>
                <div class="block filled"></div>
                <div class="block filled"></div>
                <div class="block filled"></div>
                <div class="block empty"></div>
                <div class="block empty"></div>
                <div class="coins-icon">🪙</div>
            </div>
        </div>

        <!-- LIVELLO 3 -->
        <div class="bottom-section">
            
            <div class="btn skills-btn">
                <div class="btn-icon-art">🎒</div>
                <div class="btn-text">SKILLS</div>
            </div>

            <div class="current-score-container">
                <div class="current-score-title">CURRENT SCORE</div>
                <div class="current-score-number">15,740</div>
            </div>

            <div class="btn shop-btn">
                <div class="btn-icon-art">🏪</div>
                <div class="btn-text">SHOP</div>
            </div>

        </div>
    </div>

</body>
</html>
