<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Meta tag essenziali per la codifica dei caratteri e la visualizzazione responsive su mobile -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over Screen Animato</title>
    
    <style>
        /* Importazione dei font Pixel Art da Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap');

        /* Reset CSS: azzera margini, padding e imposta il box-sizing per evitare problemi di calcolo delle dimensioni */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none; /* Impedisce all'utente di selezionare il testo per errore */
            image-rendering: pixelated;
        }

        /* Stile del corpo della pagina: occupa tutta l'altezza dello schermo e centra i contenuti */
        body {
            height: 100vh; /* 100vh = 100% dell'altezza del viewport (schermo) */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra verticalmente il contenuto */
            align-items: center;    /* Centra orizzontalmente il contenuto */
            background: radial-gradient(circle at 50% 50%, #581c87 0%, #2e1065 100%);
            overflow: hidden; /* Nasconde le barre di scorrimento */
            position: relative; /* Posizionamento relativo per ancorare il canvas dei coriandoli allo sfondo */
        }

        /* Canvas per i coriandoli: posizionato in assoluto per coprire tutto lo schermo dietro l'interfaccia */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Livello più basso, sta dietro a tutto il resto */
            pointer-events: none; /* Fondamentale: permette di cliccare i bottoni anche se il canvas li copre visivamente */
        }

        /* Contenitore principale dell'interfaccia utente (testi e bottone) */
        .container {
            position: relative;
            z-index: 1; /* Livello superiore rispetto al canvas, così i testi sono davanti ai coriandoli */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px; /* Padding laterale per non far toccare i bordi su schermi piccoli */
        }

        /* Gruppo che contiene la corona e i testi del punteggio */
        .score-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px; /* Distanza tra il gruppo dei punteggi e il pulsante Play in basso */
        }

        /* Immagine della corona */
        .crown {
            width: 110px;
            margin-bottom: 20px; /* Spazio sotto la corona */
            filter: drop-shadow(4px 4px 0px #000000);
            object-fit: contain;
            image-rendering: pixelated;
            
            /* --- Setup iniziale per l'animazione di entrata --- */
            opacity: 0; /* Inizialmente invisibile */
            transform: scale(0.5); /* Inizialmente rimpicciolito */
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; /* Applica l'animazione 'popIn' con un effetto rimbalzo */
            animation-delay: 0.1s; /* Ritardo di 0.1 secondi per far apparire prima la corona */
        }

        /* Testo "Best Score!" (Giallo Pixel) */
        .best-score-text {
            color: #ffd700;
            font-size: clamp(18px, 5vw, 32px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #c79500, 6px 6px 0px #000000;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-align: center;
            
            /* Animazione di entrata */
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.25s; /* Appare dopo la corona */
        }

        /* Testo "Score" (Viola chiaro Pixel) */
        .score-label {
            color: #d8b4fe;
            font-size: clamp(11px, 3.2vw, 16px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000000;
            margin-bottom: 12px;
            
            /* Animazione di entrata */
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.4s; /* Appare dopo 'Best Score' */
        }

        /* Numero del punteggio "864" (Bianco Pixel) */
        .score-number {
            color: #ffffff;
            font-size: clamp(34px, 9vw, 58px);
            font-weight: bold;
            line-height: 1;
            text-shadow: 4px 4px 0px #000000;
            
            /* Animazione di entrata */
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.5s; /* Appare per ultimo */
        }

        /* Pulsante Play verde Pixel Art */
        .play-button {
            background-color: #2ecc71;
            width: 86px;
            height: 86px;
            border-radius: 0px;
            border: 4px solid #000000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 4px 4px 0px #abebc6, 
                inset -4px -4px 0px #1e9b57, 
                6px 6px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.65s;
        }

        .play-button:active {
            transform: translate(3px, 3px);
            box-shadow: 
                inset 4px 4px 0px #abebc6, 
                inset -4px -4px 0px #1e9b57, 
                3px 3px 0px #000000;
        }

        /* Effetto quando si clicca e tiene premuto il bottone (viene spinto verso il basso) */
        .play-button:active {
            transform: translateY(4px); /* Sposta in basso di 4px */
            box-shadow: 0 2px 0 #1e9b57, 0 5px 5px rgba(0,0,0,0.3); /* Riduce l'ombra per simulare la pressione */
        }

        /* Icona Play (creata con i bordi CSS per formare un triangolo) */
        .play-icon {
            width: 0; 
            height: 0; 
            border-top: 15px solid transparent; /* Bordo superiore trasparente */
            border-bottom: 15px solid transparent; /* Bordo inferiore trasparente */
            border-left: 24px solid #ffffff; /* Bordo sinistro bianco, questo crea il triangolo */
            margin-left: 6px; /* Correzione visiva: sposta leggermente a destra per centrare il triangolo nel cerchio */
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2));
        }

        /* --- Keyframes dell'animazione di entrata 'popIn' --- */
        /* Questo definisce i passaggi dell'animazione usata sopra */
        @keyframes popIn {
            0% { 
                opacity: 0; /* Invisibile */
                transform: scale(0.5) translateY(20px); /* Piccolo e spostato in basso */
            }
            70% { 
                transform: scale(1.1) translateY(0); /* Leggermente più grande del normale (overshoot per effetto rimbalzo) */
            }
            100% { 
                opacity: 1; /* Completamente visibile */
                transform: scale(1) translateY(0); /* Dimensione naturale finale */
            }
        }
    </style>
</head>
<body>

    <!-- Canvas usato per disegnare i coriandoli animati via JavaScript -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Contenitore principale dell'interfaccia utente -->
    <div class="container">
        
        <!-- Gruppo che racchiude Corona e Punteggi per gestirne le distanze -->
        <div class="score-group">
            <!-- Immagine della corona (link fornito in precedenza) -->
            <img src="https://z-cdn-media.chatglm.cn/files/cd783802-0d77-4a2a-a1cd-be461209e134.png?auth_key=1889038769-5d2e59c7f2b949aa95db73113efcbc29-0-803c51fbf5c9fc13345f9e1fc52eaa0a" alt="Corona" class="crown">
            
            <!-- Testo a schermo -->
            <div class="best-score-text">Best Score!</div>
            <div class="score-label">Score</div>
            <div class="score-number">864</div>
        </div>

        <!-- Pulsante Play. L'attributo onclick chiama la funzione JavaScript restartGame() quando viene cliccato -->
        <button class="play-button" onclick="restartGame()">
            <div class="play-icon"></div>
        </button>
    </div>

    <script>
        // =========================================================================
        // GESTIONE DEI CORIANDOLI (CANVAS E FISICA)
        // =========================================================================

        // Prendo il riferimento al canvas nel HTML e il suo contesto di disegno (2D)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let W, H; // Variabili per memorizzare larghezza e altezza dello schermo

        // Funzione per adattare la grandezza del canvas alla finestra del browser
        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        // Ascolto l'evento 'resize' della finestra: se l'utente rimpicciolisce/allarga il browser, il canvas si adatta
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Chiamata iniziale per impostare le dimensioni appena la pagina carica

        // Array che conterrà tutti i coriandoli attualmente in volo sullo schermo
        const confettiParticles = [];
        // Array di colori disponibili per i coriandoli
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff0000', '#ffffff', '#ff9b3d', '#38d977'];

        // Funzione per generare e "sparare" i coriandoli dal centro dello schermo
        function shootConfetti() {
            const numberOfConfetti = 150; // Numero di coriandoli da generare
            for (let i = 0; i < numberOfConfetti; i++) {
                
                // Genera un angolo casuale (da 0 a 360 gradi, in radianti) per sparare in tutte le direzioni
                const angle = Math.random() * Math.PI * 2; 
                // Genera una velocità iniziale casuale
                const velocity = Math.random() * 12 + 8; 
                
                // Aggiungo il singolo coriandolo all'array con tutte le sue proprietà fisiche
                confettiParticles.push({
                    x: W / 2, // Posizione iniziale X (centro schermo orizzontale)
                    y: H / 2 - 50, // Posizione iniziale Y (leggermente sopra il centro)
                    vx: Math.cos(angle) * velocity, // Velocità orizzontale calcolata tramite trigonometria
                    vy: Math.sin(angle) * velocity - 5, // Velocità verticale (-5 dà una spinta iniziale verso l'alto)
                    size: Math.random() * 8 + 4, // Dimensione casuale del coriandolo
                    color: colors[Math.floor(Math.random() * colors.length)], // Colore casuale pescato dall'array
                    rotation: Math.random() * 360, // Rotazione iniziale casuale
                    vRot: Math.random() * 10 - 5, // Velocità di rotazione (può girare in senso orario o antiorario)
                    gravity: 0.25, // Costante di gravità: ad ogni frame aggiungerà 0.25 alla velocità verticale (facendoli cadere)
                    friction: 0.99 // Attrito: rallenta leggermente il movimento ad ogni frame per un effetto più realistico
                });
            }
        }

        // Funzione che disegna e aggiorna la posizione dei coriandoli ad ogni frame (circa 60 volte al secondo)
        function animateConfetti() {
            // Pulisce completamente il canvas ad ogni frame (cancella il frame precedente)
            ctx.clearRect(0, 0, W, H);

            // Scorro l'array dei coriandoli al contrario. Si fa al contrario per poter rimuovere elementi dall'array durante il ciclo senza bug
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                let p = confettiParticles[i]; // Prendo il singolo coriandolo
                
                // --- APPLICAZIONE DELLA FISICA ---
                p.vy += p.gravity; // Aggiunge la gravità alla velocità verticale (lo fa accelerare verso il basso)
                p.vx *= p.friction; // Applica l'attrito orizzontale
                p.vy *= p.friction; // Applica l'attrito verticale
                p.x += p.vx; // Aggiorna la posizione X in base alla velocità
                p.y += p.vy; // Aggiorna la posizione Y in base alla velocità
                p.rotation += p.vRot; // Aggiorna la rotazione

                // --- DISEGNO SUL CANVAS ---
                ctx.save(); // Salva lo stato attuale del canvas
                ctx.translate(p.x, p.y); // Sposta l'origine del canvas al centro del coriandolo
                ctx.rotate(p.rotation * Math.PI / 180); // Ruota il canvas in base alla rotazione del coriandolo
                ctx.fillStyle = p.color; // Imposta il colore di riempimento
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.4); // Disegna un rettangolino (coriandolo)
                ctx.restore(); // Ripristina il canvas allo stato salvato in precedenza

                // Se il coriandolo esce dal fondo dello schermo, lo elimino dall'array per risparmiare memoria
                if (p.y > H + 50) {
                    confettiParticles.splice(i, 1); // Rimuove 1 elemento alla posizione 'i'
                }
            }

            // Richiede al browser di chiamare di nuovo questa stessa funzione per il prossimo frame
            requestAnimationFrame(animateConfetti);
        }

        // Avvio il ciclo di animazione del canvas
        animateConfetti();
        // Sparo i coriandoli 100 millisecondi dopo il caricamento per sincronizzarmi con l'animazione di entrata della corona
        setTimeout(shootConfetti, 100);


        // =========================================================================
        // GESTIONE CLICK PULSANTE "PLAY"
        // =========================================================================
        
        // Funzione chiamata quando l'utente clicca il pulsante verde Play
        function restartGame() {
            // Qui non spariamo più i coriandoli come richiesto.
            
            // --- INSERISCI QUI LA TUA LOGICA PER GIOCARE UNA NUOVA PARTITA ---
            // Esempi di cosa potresti fare:
            // 1. Reindirizzare a un'altra pagina web:
            // window.location.href = '/gioca';
            
            // 2. Se usi un motore come Unity/Godot tramite ponte web:
            // window.myGameEngine.StartNewMatch();
            
            // Per ora, stampo un messaggio in console per confermare che il click funziona
            console.log("Il pulsante è stato cliccato! Avvio di una nuova partita...");
        }
    </script>

</body>
</html>
